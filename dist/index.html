<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)">
<title>Edzéskövető</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f8a5f'/%3E%3Cpath d='M14 40l12-16 8 10 6-7 10 13z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface2: #efede7; --ink: #1c1f22; --ink2: #5b616a;
  --line: #e1ded5; --accent: #0f8a5f; --accent-ink: #ffffff; --accent-soft: #dff3ea;
  --work: #e8590c; --rest: #2f6fed; --rr: #7a43d6;
  --warn: #9a6200; --warn-soft: #fbf0d9; --danger: #c92a2a; --danger-soft: #fbe3e3;
  --shadow: 0 1px 2px rgba(20,20,10,.06), 0 4px 14px rgba(20,20,10,.06);
  --r: 8px; --rs: 6px; --nav-h: 52px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1214; --surface: #181c20; --surface2: #20262b; --ink: #eef1f3; --ink2: #9aa4ad;
  --line: #2a3138; --accent: #38d39f; --accent-ink: #06261b; --accent-soft: #123227;
  --work: #ff8a3d; --rest: #6b9bff; --rr: #b08cff;
  --warn: #f2c14e; --warn-soft: #3a2f12; --danger: #ff6b6b; --danger-soft: #3d1c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --bg: #0f1214; --surface: #181c20; --surface2: #20262b; --ink: #eef1f3; --ink2: #9aa4ad;
    --line: #2a3138; --accent: #38d39f; --accent-ink: #06261b; --accent-soft: #123227;
    --work: #ff8a3d; --rest: #6b9bff; --rr: #b08cff;
    --warn: #f2c14e; --warn-soft: #3a2f12; --danger: #ff6b6b; --danger-soft: #3d1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; font-size: 14px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
body.noscroll { overflow: hidden; }
a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h2 { font-size: 1.05rem; margin-bottom: .4rem; }
p { margin: 0 0 .6rem; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--ink2); font-size: .85rem; }
.hide-s { display: none; }
.i { width: 20px; height: 20px; flex: none; }

/* ---------- layout ---------- */
#app { min-height: 100vh; min-height: 100dvh; }
#view { padding-bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); min-width: 0; }
#nav {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
#nav .brand { display: none; }
#nav a {
  flex: 1; height: var(--nav-h); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px; font-size: .65rem; color: var(--ink2); min-width: 0;
}
#nav a .i { width: 20px; height: 20px; }
#nav a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#nav a.on { color: var(--accent); font-weight: 600; }

.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 4px;
  padding: 4px 8px; padding-top: calc(4px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); min-height: 46px;
}
.top-t { flex: 1; min-width: 0; }
.top h1 { font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .sub { font-size: .72rem; color: var(--ink2); line-height: 1.2; }
.top-a { display: flex; gap: 4px; align-items: center; }
.page { padding: 8px; max-width: 760px; margin: 0 auto; }
.page.wide { max-width: 1180px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 38px; padding: 0 12px; border-radius: var(--rs); cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .92rem;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.ghost-danger { color: var(--danger); }
.btn.small { min-height: 32px; padding: 0 10px; font-size: .85rem; }
.btn[disabled], .icon-btn[disabled] { opacity: .35; pointer-events: none; }
.icon-btn {
  width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--rs); border: 0; background: transparent; cursor: pointer; color: var(--ink2); flex: none;
}
.icon-btn:hover { background: var(--surface2); }
.icon-btn.sm { width: 30px; height: 30px; }
.icon-btn.sm .i { width: 16px; height: 16px; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; min-height: 36px; padding: 4px 10px; border-radius: var(--rs);
  border: 1px solid var(--line); background: var(--surface); outline: none;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
label.f { display: block; margin: 0 0 8px; font-size: .78rem; color: var(--ink2); font-weight: 600; }
label.f > input, label.f > select, label.f > textarea { margin-top: 3px; font-weight: 400; color: var(--ink); }
.check { display: flex; align-items: center; gap: 8px; min-height: 34px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.checklist { max-height: 38vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--rs); padding: 2px 10px; margin-bottom: 8px; }

.chip {
  display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: var(--rs);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .9rem;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-block; font-size: .66rem; padding: 0 6px; border-radius: 4px; background: var(--surface2); color: var(--ink2); margin-left: 6px; vertical-align: middle; font-weight: 600; }
.badge { display: inline-block; font-size: .72rem; font-weight: 700; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.hot { background: var(--warn-soft); color: var(--warn); }
.badge.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink2); font-weight: 500; }

/* ---------- cards, lists ---------- */
.cards { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); margin-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin-bottom: 8px; }
.cards .card { margin: 0; }
.card.link { display: block; }
.card.link:active { transform: scale(.99); }
.card-t { font-weight: 700; }
.list > * + * { border-top: 1px solid var(--line); }
.list-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; min-height: 44px; cursor: pointer; width: 100%; text-align: left; background: none; border: 0; }
.list-row .grow { flex: 1; min-width: 0; }
.rows { display: grid; gap: 6px; margin-bottom: 8px; }
.rows .list-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; }
.rows > p { margin: 0; }
.empty-state { text-align: center; padding: 18px 8px; color: var(--ink2); }
.empty-state h2 { color: var(--ink); }
.steps { text-align: left; display: inline-block; margin: 0 0 10px; padding-left: 1.1rem; }
.banner { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--warn-soft); color: var(--warn); border-radius: var(--rs); padding: 6px 10px; margin: 8px 8px 0; font-size: .85rem; }

.tabs { display: flex; gap: 0; padding: 0 8px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--ink2); font-weight: 600; font-size: .9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs a.on { color: var(--accent); border-color: var(--accent); }

/* ---------- matrix ---------- */
.matrix-wrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: calc(100vh - 150px); }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; }
.matrix th, .matrix td { padding: 5px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; vertical-align: top; background: var(--surface); }
.matrix thead th { position: sticky; top: 0; z-index: 2; background: var(--surface2); font-size: .72rem; text-transform: uppercase; letter-spacing: .02em; min-width: 100px; }
.matrix .stick { position: sticky; left: 0; z-index: 1; min-width: 78px; max-width: 120px; background: var(--surface2); font-weight: 600; font-size: .9rem; }
.matrix thead .stick { z-index: 3; }
.matrix tr:last-child > * { border-bottom: 0; }
.matrix td { position: relative; }
.matrix td .st { font-weight: 600; line-height: 1.2; }
.matrix td .st.pad { padding-right: 20px; }
.badge.corner { position: absolute; top: 0; right: 0; border-radius: 0 0 0 4px; font-size: .64rem; padding: 0 5px; line-height: 1.35; }
.matrix td small, .matrix th small { display: block; color: var(--ink2); font-weight: 400; text-transform: none; letter-spacing: 0; font-size: .7rem; line-height: 1.25; }
.matrix td.hot { background: var(--warn-soft); }
.matrix td.empty { color: var(--ink2); text-align: center; }
.matrix td .next { color: var(--accent); font-weight: 600; font-size: .72rem; margin-top: 1px; line-height: 1.2; }
.warn-note { color: var(--warn) !important; }
.matrix th a:hover { text-decoration: underline; }

/* ---------- blocks / session ---------- */
.blocks { display: grid; gap: 8px; margin-bottom: 8px; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.block-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 2px 4px 2px 10px; background: var(--surface2); flex-wrap: wrap; }
.block-t { display: flex; align-items: center; gap: 8px; }
.bn { width: 22px; height: 22px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 700; }
.block.iv .bn { background: var(--work); color: #fff; }
.block-a { display: flex; align-items: center; gap: 0; }
.rounds { display: flex; align-items: center; gap: 5px; font-size: .78rem; color: var(--ink2); margin-right: 4px; }
.rounds input { width: 48px; min-height: 30px; padding: 2px 6px; text-align: center; }
.block-b { padding: 2px 10px 8px; }
.item { padding: 6px 0; }
.item + .item { border-top: 1px dashed var(--line); }
.item-h { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.item-n { font-weight: 700; }
.item-a { display: flex; }
.block-top, .block-f {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 36px; padding: 0 10px;
  border: 0; background: none; color: var(--accent); font-weight: 600; font-size: .92rem; cursor: pointer;
}
.block-top { background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.block.iv .block-top { background: color-mix(in srgb, var(--work) 14%, var(--surface)); color: var(--work); }
.block-f { margin: 4px -10px -8px; width: calc(100% + 20px); border-top: 1px solid var(--line); }
.block-top:active, .block-f:active { filter: brightness(.95); }
.btn.full { display: flex; width: 100%; }
.join { display: flex; margin: 0 0 8px; }
.join .btn { flex: 1; border-radius: 0; }
.join .btn:first-child { border-radius: var(--rs) 0 0 var(--rs); }
.join .btn:last-child { border-radius: 0 var(--rs) var(--rs) 0; margin-left: -1px; }
.trow { display: grid; grid-template-columns: 1fr; grid-template-areas: 'tn' 'ctl' 'meta' 'note'; gap: 4px; padding: 5px 6px; margin-top: 4px; border-radius: var(--rs); background: var(--bg); }
.trow .tn { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.trow .tn a { font-weight: 600; }
.trow .prev { font-size: .74rem; color: var(--ink2); }
.tctl { display: flex; gap: 4px; align-items: stretch; }
.stage {
  flex: 1; min-width: 0; min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left;
  padding: 3px 10px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600;
}
.stage > span:first-child { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; }
.stage .badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; flex: none; }
.stage.changed { border-color: var(--accent); background: var(--accent-soft); }
.stage.unset { border-style: dashed; color: var(--ink2); font-weight: 500; }
.mini { width: 38px; min-height: 38px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); flex: none; }
.tctl { grid-area: ctl; }
.trow .tn { grid-area: tn; }
.tmeta { grid-area: meta; display: flex; gap: 4px; align-items: stretch; }
.tmeta input { min-height: 34px; font-size: .88rem; }
.tmeta .rr { align-self: center; color: var(--ink2); font-weight: 600; font-size: .9rem; flex: none; }
.tmeta .reps { flex: 0 0 64px; width: 64px; min-width: 0; text-align: center; }
.tmeta .wt { }
.tmeta .spacer { flex: 1; }
.tmeta input[type=number] { -moz-appearance: textfield; }
.tmeta input::-webkit-outer-spin-button, .tmeta input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.tmeta .wt { display: none; flex: 0 0 64px; width: 64px; text-align: right; }
.trow.show-w .wt { display: block; }
.kgbtn { flex: none; min-height: 34px; padding: 0 9px; border-radius: var(--rs); border: 1px solid var(--line); background: var(--surface); color: var(--ink2); font-weight: 600; font-size: .82rem; cursor: pointer; }
.kgbtn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tmeta .notebtn { width: 34px; height: auto; min-height: 34px; border: 1px solid var(--line); background: var(--surface); }
.tmeta .notebtn.on { color: var(--accent); border-color: var(--accent); }
.note-in { grid-area: note; display: none; min-height: 34px; font-size: .88rem; }
.trow.show-note .note-in { display: block; }
.note { font-style: italic; }
.tl-note { font-size: .8rem; color: var(--ink2); font-style: italic; padding: 0 0 2px; }
.iv-sum { padding: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
.iv-sum b { color: var(--work); }
.iv-item { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0; }

/* ---------- briefing / summary ---------- */
.brief-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin-bottom: 8px; }
.brief-item h2 { font-size: 1.15rem; margin-bottom: 0; }
.bgroup { border-left: 3px solid var(--accent); padding: 3px 0 3px 10px; margin-top: 8px; }
.bgroup .bg-l { font-weight: 700; font-size: 1rem; }
.bgroup .bg-n { display: flex; gap: 2px 12px; flex-wrap: wrap; margin-top: 2px; }
.bgroup .bg-n span { white-space: nowrap; }
.bgroup.none { border-color: var(--line); color: var(--ink2); }
.pn { display: inline-flex; align-items: center; gap: 4px; }
.pn small { color: var(--ink2); }
.step-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }

/* ---------- path / timeline ---------- */
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; font-size: .82rem; }
.path .p { background: var(--surface2); border-radius: 4px; padding: 0 6px; }
.path .a { color: var(--ink2); }
.tl-day { padding: 6px 0; }
.tl-day + .tl-day { border-top: 1px solid var(--line); }
.tl-day .d { font-weight: 700; font-size: .9rem; }
.tl-ent { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; padding: 1px 0; }

/* ---------- sheet ---------- */
.overlay { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 50; background: rgba(8,10,12,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 100%; overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 12px 12px 0 0; padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  box-shadow: 0 -8px 40px rgba(0,0,0,.3); animation: up .18s ease-out;
}
.sheet .row.end:last-child, .sheet .row.between:last-child {
  position: sticky; bottom: -12px; background: var(--surface); padding: 8px 0 12px; margin: 0 0 -12px; z-index: 2;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.ladder { display: grid; gap: 4px; margin: 6px 0 10px; }
.step { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; text-align: left; border-radius: var(--rs); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; }
.step .si { width: 20px; height: 20px; border-radius: 4px; background: var(--surface2); font-size: .7rem; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ink2); }
.step.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.step.on .si { background: rgba(255,255,255,.25); color: inherit; }
.step.was { border-color: var(--accent); }
.step em { margin-left: auto; font-style: normal; font-size: .7rem; color: var(--accent); }
.step.on em { color: inherit; }
.pick-res { display: grid; gap: 0; margin: 6px 0; max-height: 44vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--rs); }
.pick-res > * + * { border-top: 1px solid var(--line); }
.pick-res .check, .pick-res .pick-add { padding: 0 10px; min-height: 40px; }
.pick-res .check.off { opacity: .5; }
.pick-add { display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer; text-align: left; color: var(--accent); font-weight: 600; }
.pick-sel { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.pick-sel .chip { min-height: 28px; font-size: .85rem; }
.toast { position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--rs); font-size: .88rem; box-shadow: var(--shadow); max-width: 90vw; }

/* ---------- exercise editor ---------- */
.step-edit { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; align-items: center; padding: 2px 0; }
.step-edit .n { color: var(--ink2); font-size: .8rem; text-align: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--rs); overflow: hidden; background: var(--surface); }
.seg button { min-height: 34px; padding: 0 12px; border: 0; background: none; cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--ink2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* ---------- timer ---------- */
.stepper { display: flex; align-items: stretch; margin-top: 3px; }
.stepper button { width: 40px; min-height: 36px; border: 1px solid var(--line); background: var(--surface2); font-size: 1.15rem; cursor: pointer; flex: none; padding: 0; }
.stepper button:first-child { border-radius: var(--rs) 0 0 var(--rs); }
.stepper button:last-child { border-radius: 0 var(--rs) var(--rs) 0; }
.stepper input { flex: 1; text-align: center; font-weight: 700; border-radius: 0; margin: 0 -1px; min-width: 0; position: relative; }
.stepper input:focus { z-index: 1; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper input[type=number] { -moz-appearance: textfield; }
label.f > .stepper { margin-top: 3px; }
.fields { display: grid; gap: 0 8px; grid-template-columns: 1fr 1fr; }
.fields label.f { margin-bottom: 6px; }
.fields .full { grid-column: 1 / -1; }

.tm-count { font-size: clamp(5.5rem, 32vw, 11rem); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tm-ex { font-size: 1.35rem; font-weight: 700; min-height: 1.6rem; }
.tm-next { color: var(--ink2); font-size: .9rem; }
.tm-bar { width: 100%; max-width: 420px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.tm-bar i { display: block; height: 100%; background: var(--c); width: 0; }
.tm-ctl { display: flex; gap: 8px; margin-top: 6px; }
.tm-ctl .btn { min-width: 58px; min-height: 52px; border-radius: var(--r); }
.tm-ctl .btn .i { width: 24px; height: 24px; }

/* ---------- metronome ---------- */
.metro { text-align: center; padding-top: 4px; }
.dot { width: 120px; height: 120px; margin: 6px auto 12px; border-radius: 50%; background: var(--surface2); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink2); }
.dot.beat { animation: beat .35s ease-out; border-color: var(--accent); color: var(--accent); }
.dot.beat.acc { border-color: var(--work); color: var(--work); }

.big-play { width: 100%; max-width: 320px; min-height: 50px; font-size: 1.05rem; }
input[type=range] { width: 100%; accent-color: var(--accent); }

@media (max-width: 559px) {

  .page > .card, .blocks .block, .brief-item, .cards .card, .matrix-wrap {

  .rows .list-row { border-radius: 0; border-left: 0; border-right: 0; }
  .btn.full { border-radius: 0; border-left: 0; border-right: 0; margin-bottom: 6px; }
  .cards { gap: 0; }
  .cards .card { margin-bottom: 0; border-top: 0; }
  .blocks { gap: 6px; }
  .matrix-wrap { max-height: calc(100vh - 150px); }
  .tm { border-radius: 0; border-left: 0; border-right: 0; }
  .tabs { padding: 0 4px; }
  .banner { margin: 6px 8px 0; }
}

/* ---------- desktop ---------- */
@media (min-width: 560px) {
  .hide-s { display: inline; }
  .page { padding: 12px; }
  .trow { grid-template-columns: minmax(150px, 220px) 1fr; grid-template-areas: 'tn ctl' 'tn meta' 'tn note'; align-items: center; }
  .trow .tn { flex-direction: column; gap: 0; }
  .overlay { align-items: center; padding: 20px; }
  .sheet { max-height: 92%; }
  .sheet { border-radius: 12px; }
}
@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 200px 1fr; }
  #nav { position: sticky; top: 0; height: 100vh; flex-direction: column; justify-content: flex-start; gap: 2px; border-top: 0; border-right: 1px solid var(--line); padding: 12px 8px; }

  #view { padding-bottom: 24px; }
  .toast { bottom: 20px; }
  .blocks { grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); align-items: start; }
  .matrix-wrap { max-height: calc(100vh - 140px); }
  .tm { min-height: calc(100vh - 110px); }
}

/* iOS zooms into inputs below 16px */
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}

/* ---------- planner ---------- */
.plan-list { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.plan-row { display: flex; align-items: center; gap: 6px; padding: 2px 8px; border-bottom: 1px solid var(--line); }

.plan-name { flex: 1; min-width: 0; min-height: 40px; display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 0; cursor: pointer; font-weight: 600; padding: 0; }
.plan-name .pn-n { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-size: .75rem; display: inline-flex; align-items: center; justify-content: center; flex: none; visibility: hidden; }
.plan-row.on .pn-n { visibility: visible; }
.plan-row .seg button { min-height: 32px; min-width: 28px; padding: 0 6px; }
.plan-sum { font-size: .9rem; }
.plan-sum > div + div { margin-top: 2px; }
.plan-bar {

.plan-bar .muted { flex: 1; min-width: 90px; }
.chips .tag { margin: 0; font-size: .75rem; padding: 1px 8px; }
@media (min-width: 900px) { .plan-bar { bottom: 0; } }
@media (max-width: 559px) { .plan-bar .btn.primary { flex: 1 1 100%; }
  .plan-bar { margin-left: 0; margin-right: 0; padding-left: 8px; padding-right: 8px; } }

/* ---------- session tabs ---------- */
.block-h.acc { width: 100%; border: 0; text-align: left; cursor: pointer; padding: 6px 10px; gap: 8px; flex-wrap: nowrap; color: inherit; }
.acc-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.acc-t .block-t { flex-wrap: wrap; }
.acc-s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 30px; font-size: .78rem; }
.pgm-ex { border-top: 1px solid var(--line); }
.pgm-ex:first-of-type { border-top: 0; }
.pgm-ex summary { font-weight: 700; font-size: 1.05rem; padding: 8px 0; cursor: pointer; }
.pgm-ex[open] { padding-bottom: 6px; }
.brief-item.iv h2 { color: var(--work); }
.brief-item h2 .tag { font-size: .7rem; }
.sess { display: flex; align-items: center; gap: 8px; }
.sess-main { flex: 1; min-width: 0; }
.sess-btns { display: flex; gap: 4px; }

.sect-h { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 10px 0 4px; padding: 0 8px; }

.srow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }

.srow-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

.srow-s { font-weight: 600; text-align: right; }

.block-b .item { padding: 0 0 4px; }

.block-b .item-n { font-size: 1.06rem; }
.cnt { font-size: .78rem; color: var(--ink2); font-weight: 700; margin-left: auto; padding-left: 8px; font-variant-numeric: tabular-nums; }
.block-h.acc .cnt { margin-left: 0; padding: 0 6px; }
.trow.done { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.tn-l { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }

.donebtn .i { width: 14px; height: 14px; stroke-width: 3; }
.donebtn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.banner.bad { background: var(--danger-soft); color: var(--danger); }

/* 02-store.js */
const STORE_KEY = 'workout-program.v1';
let db;
let _ix = null;

const DEFAULTS = () => ({
  v: 1,
  settings: {
    lang: 'hu', theme: 'auto', threshold: 4, vol: 0.7, lastBackup: null,
    timer: { rounds: 3, n: 3, work: 40, rest: 20, roundRest: 60, prep: 5, names: '' },
    metro: { sec: 1, accent: 0 },
  },
  trainees: [], groups: [], exercises: [], templates: [], sessions: [], entries: [],
});

function normalizeDb(raw) {
  const d = DEFAULTS();
  if (!raw || typeof raw !== 'object') return d;
  for (const k of ['trainees', 'groups', 'exercises', 'templates', 'sessions', 'entries']) if (Array.isArray(raw[k])) d[k] = raw[k];
  const s = raw.settings;
  if (s && typeof s === 'object') {
    d.settings = { ...d.settings, ...s, timer: { ...d.settings.timer, ...(s.timer || {}) }, metro: { ...d.settings.metro, ...(s.metro || {}) } };
  }
  for (const x of d.trainees) delete x.active;
  // Reps are a plain number now ("3x8" -> 8); anything else moves into the note. Rounds come from the block.
  const sess = new Map(d.sessions.map(s => [s.id, s]));
  for (const e of d.entries) {
    if (e.reps !== undefined && e.reps !== '') {
      const m = String(e.reps).trim().match(/^(?:\d+\s*[x×*]\s*)?(\d+)$/i);
      if (m) e.reps = m[1];
      else { e.note = [e.note, e.reps].filter(Boolean).join('; '); delete e.reps; }
    }
    if (e.rounds === undefined) {
      const s = sess.get(e.sessionId), b = s && s.blocks.find(x => x.type === 'strength' && x.items.some(i => (i.exId || 'n:' + norm(i.name)) === e.ek));
      if (b) e.rounds = b.rounds;
    }
  }
  // Older data kept the usual workout as blocks inside the group: turn it into a named template.
  for (const g of d.groups) {
    if (!Array.isArray(g.template)) continue;
    const ids = [];
    for (const b of g.template) if (b.type === 'strength') for (const it of b.items) if (it.exId && !ids.includes(it.exId)) ids.push(it.exId);
    if (ids.length && !g.templateId) { const tp = { id: uid(), name: g.name, exIds: ids }; d.templates.push(tp); g.templateId = tp.id; }
    delete g.template;
  }
  return d;
}

let storageOk = true, dataSize = 0;
function load() {
  let s = null;
  try { s = localStorage.getItem(STORE_KEY); db = normalizeDb(s ? JSON.parse(s) : null); dataSize = s ? s.length : 0; }
  catch (e) {
    db = DEFAULTS();
    // unreadable data: keep a copy so the next save does not silently overwrite it
    try { if (s) localStorage.setItem(STORE_KEY + '.corrupt', s); } catch (e2) { storageOk = false; }
  }
  try { localStorage.setItem(STORE_KEY + '.probe', '1'); localStorage.removeItem(STORE_KEY + '.probe'); } catch (e) { storageOk = false; }
  // ask the browser not to evict the data when it is short on space
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}

function save() {
  _ix = null;
  try { const s = JSON.stringify(db); dataSize = s.length; localStorage.setItem(STORE_KEY, s); }
  catch (e) { storageOk = false; toast(t('err.save')); }
}
const bigData = () => dataSize > 2.5e6; // localStorage holds roughly 5M characters

// Lookup maps, rebuilt lazily after every save().
function ix() {
  if (!_ix) {
    _ix = {
      sess: new Map(db.sessions.map(s => [s.id, s])),
      ex: new Map(db.exercises.map(x => [x.id, x])),
      tr: new Map(db.trainees.map(x => [x.id, x])),
      gr: new Map(db.groups.map(x => [x.id, x])),
      tp: new Map(db.templates.map(x => [x.id, x])),
    };
  }
  return _ix;
}
const getSession = id => ix().sess.get(id);
const getExercise = id => ix().ex.get(id);
const getTrainee = id => ix().tr.get(id);
const getGroup = id => ix().gr.get(id);
const getTemplate = id => (id ? ix().tp.get(id) : undefined);

function deleteSessionData(ids) {
  const set = new Set(ids);
  db.sessions = db.sessions.filter(s => !set.has(s.id));
  db.entries = db.entries.filter(e => !set.has(e.sessionId));
}
function deleteTrainee(id) {
  db.groups.filter(g => g.solo && g.traineeIds.length === 1 && g.traineeIds[0] === id).forEach(g => deleteGroup(g.id));
  db.trainees = db.trainees.filter(x => x.id !== id);
  db.groups.forEach(g => { g.traineeIds = g.traineeIds.filter(x => x !== id); });
  db.sessions.forEach(s => { s.attendeeIds = s.attendeeIds.filter(x => x !== id); });
  db.entries = db.entries.filter(e => e.traineeId !== id);
}
function deleteGroup(id) {
  deleteSessionData(db.sessions.filter(s => s.groupId === id).map(s => s.id));
  db.groups = db.groups.filter(g => g.id !== id);
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `edzeskovet-adatok-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  db.settings.lastBackup = todayStr();
  save();
  render();
}
function importData(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return false; }
  if (!raw || !Array.isArray(raw.trainees) || !Array.isArray(raw.sessions) || !Array.isArray(raw.groups)) return false;
  db = normalizeDb(raw);
  save();
  return true;
}

/* 03-logic.js */
// Domain logic: stages, streaks, prefill, matrix data.
const sessionCmp = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0));
const isSet = e => !!(e.progId || e.text);
const ek = item => (item.exId ? item.exId : 'n:' + norm(item.name));
const ladder = key => getExercise(key)?.steps || [];
const itemName = it => (it.exId && getExercise(it.exId) ? getExercise(it.exId).name : it.name);

function exName(key) {
  const ex = getExercise(key);
  if (ex) return ex.name;
  const en = db.entries.find(e => e.ek === key && e.exName);
  if (en) return en.exName;
  return key.startsWith('n:') ? key.slice(2) : '?';
}

function entryLabel(e) {
  if (e.progId) { const s = ladder(e.ek).find(x => x.id === e.progId); return s ? s.label : (e.label || '?'); }
  return e.text || '';
}
const sameStage = (a, b) => (a.progId || b.progId ? a.progId === b.progId : norm(a.text) === norm(b.text));
// Entry detail: reps, optional weight (only when "weighted" is ticked) and an optional note that never counts for streaks.
const wkey = e => (e.weighted ? String(e.weight || '').trim().replace(',', '.') : '');
const sameExact = (a, b) => sameStage(a, b) && norm(a.reps) === norm(b.reps) && wkey(a) === wkey(b);
const extraText = (e, short) => [e.reps ? (short || !e.rounds ? t('reps.n', { n: e.reps }) : `${e.rounds}×${e.reps}`) : '', e.weighted ? (wkey(e) ? `+${wkey(e)} kg` : '+kg') : ''].filter(Boolean).join(' ');

// All set entries of a trainee for one exercise, newest session first.
function history(tid, key) {
  const out = [];
  for (const e of db.entries) {
    if (e.traineeId !== tid || e.ek !== key || !isSet(e)) continue;
    const s = getSession(e.sessionId);
    if (s) out.push({ e, s });
  }
  return out.sort((x, y) => sessionCmp(y.s, x.s));
}

// Consecutive attended sessions on the same stage (n) and on the same stage+reps+weight (exact), starting at index i.
function streakAt(h, i) {
  if (i < 0 || i >= h.length) return { n: 0, exact: 0 };
  const base = h[i].e;
  let n = 1; while (i + n < h.length && sameStage(h[i + n].e, base)) n++;
  let x = 1; while (i + x < h.length && sameExact(h[i + x].e, base)) x++;
  return { n, exact: x };
}

// Progression path of a trainee for one exercise, oldest first: [{ e, n }] (n = sessions on that step in a row).
function stagePath(tid, key) {
  const path = [];
  for (const x of history(tid, key).slice().reverse()) {
    const last = path[path.length - 1];
    if (last && sameStage(last.e, x.e)) last.n++; else path.push({ e: x.e, n: 1 });
  }
  return path;
}

// Latest done (not in the future) entry with its streak.
function latest(tid, key) {
  const h = history(tid, key), today = todayStr();
  const i = h.findIndex(x => x.s.date <= today);
  if (i < 0) return null;
  return { e: h[i].e, s: h[i].s, streak: streakAt(h, i) };
}
// Entry of the nearest planned (future) session, if any.
function planned(tid, key) {
  const today = todayStr();
  const f = history(tid, key).filter(x => x.s.date > today);
  return f.length ? f[f.length - 1].e : null;
}
// What the trainee did before this session (for prefill and "last time").
function prevEntry(s, tid, key) {
  const x = history(tid, key).find(h => h.s.id !== s.id && sessionCmp(h.s, s) <= 0);
  return x ? x.e : null;
}
const getEntry = (sid, tid, key) => db.entries.find(e => e.sessionId === sid && e.traineeId === tid && e.ek === key);

function prefill(s, tid, key) {
  const p = prevEntry(s, tid, key);
  if (!p) return {};
  const o = {};
  if (p.progId) { o.progId = p.progId; o.label = p.label; } else if (p.text) o.text = p.text;
  if (p.reps) o.reps = p.reps;
  if (p.weighted) { o.weighted = true; o.weight = p.weight; }
  return o;
}

// Make entries match attendees x strength items: create missing (prefilled from last time), drop orphans.
function syncEntries(s) {
  const keys = new Map();
  const roundsOf = new Map();
  for (const b of s.blocks) if (b.type === 'strength') for (const it of b.items) { keys.set(ek(it), it); roundsOf.set(ek(it), b.rounds); }
  db.entries = db.entries.filter(e => e.sessionId !== s.id || (s.attendeeIds.includes(e.traineeId) && keys.has(e.ek)));
  for (const tid of s.attendeeIds) {
    for (const [k, it] of keys) {
      const ex = getEntry(s.id, tid, k), rounds = roundsOf.get(k);
      if (ex) { ex.exName = itemName(it); ex.rounds = rounds; continue; }
      db.entries.push({ id: uid(), sessionId: s.id, traineeId: tid, ek: k, exId: it.exId || null, exName: itemName(it), rounds, ...prefill(s, tid, k) });
    }
  }
}

const cloneBlocks = blocks => JSON.parse(JSON.stringify(blocks)).map(b => ({ ...b, id: uid(), items: b.items.map(i => ({ ...i, id: uid() })) }));

const activeMembers = g => g.traineeIds.map(getTrainee).filter(Boolean).sort(byName);

function groupColumns(g) {
  const main = new Map();
  const tp = getTemplate(g.templateId);
  if (tp) for (const id of tp.exIds) if (getExercise(id)) main.set(id, { key: id });
  const members = new Set(g.traineeIds), extra = new Map();
  for (const e of db.entries) if (members.has(e.traineeId) && !main.has(e.ek) && isSet(e)) extra.set(e.ek, { key: e.ek });
  return { main: [...main.values()], extra: [...extra.values()].sort((a, b) => exName(a.key).localeCompare(exName(b.key), locale())) };
}

// list: [{t, e, streak}] -> stage groups ordered along the ladder (free texts last) + people without data.
function groupByStage(list, key) {
  const lad = ladder(key), map = new Map(), none = [];
  for (const it of list) {
    if (!it.e || !isSet(it.e)) { none.push(it); continue; }
    const id = it.e.progId ? 'p:' + it.e.progId : 't:' + norm(it.e.text);
    let g = map.get(id);
    if (!g) { g = { label: entryLabel(it.e), idx: it.e.progId ? lad.findIndex(s => s.id === it.e.progId) : -1, isText: !it.e.progId, items: [] }; map.set(id, g); }
    g.items.push(it);
  }
  const groups = [...map.values()].sort((a, b) => (a.isText - b.isText) || (a.idx - b.idx) || a.label.localeCompare(b.label, locale()));
  groups.forEach(g => g.items.sort((a, b) => byName(a.t, b.t)));
  none.sort((a, b) => byName(a.t, b.t));
  return { groups, none };
}

/* 04-audio.js */
// Web Audio helpers shared by the interval timer and the metronome.
let AC = null, master = null;

function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
    master = AC.createGain();
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    setVolume(db.settings.vol);
  }
  return AC;
}
function setVolume(v) {
  db.settings.vol = v;
  if (master) master.gain.value = v * v;
}
const newBus = () => { const g = AC.createGain(); g.connect(master); return g; };

function tone(bus, time, freq, dur, vol = 0.3, type = 'sine') {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(vol, time + 0.008);
  g.gain.setValueAtTime(vol, time + Math.max(0.01, dur - 0.07));
  g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(g); g.connect(bus);
  o.start(time); o.stop(time + dur + 0.03);
}

// Soft wood-block style click: a short pitched blip with a quick, higher "knock" on top.
function click(bus, time, accent) {
  const f = accent ? 1500 : 1000;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.5, time);
  o.frequency.exponentialRampToValueAtTime(f, time + 0.015);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(0.7, time + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.11);
  o.connect(g); g.connect(bus); o.start(time); o.stop(time + 0.13);
  const o2 = AC.createOscillator(), g2 = AC.createGain();
  o2.type = 'triangle'; o2.frequency.value = f * 2.4;
  g2.gain.setValueAtTime(0.0001, time);
  g2.gain.exponentialRampToValueAtTime(0.25, time + 0.001);
  g2.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
  o2.connect(g2); g2.connect(bus); o2.start(time); o2.stop(time + 0.05);
}

// Interval timer cues.
function cue(bus, kind, time) {
  switch (kind) {
    case 'tick': tone(bus, time, 880, 0.12, 0.3); break;
    case 'go': tone(bus, time, 1318, 0.55, 0.38); tone(bus, time, 2637, 0.4, 0.08); break;
    case 'rest': tone(bus, time, 784, 0.18, 0.32); tone(bus, time + 0.2, 523, 0.3, 0.32); break;
    case 'rr': [784, 659, 523].forEach((f, i) => tone(bus, time + i * 0.17, f, 0.2, 0.32)); break;
    case 'end': [523, 659, 784, 1046].forEach((f, i) => tone(bus, time + i * 0.16, f, i === 3 ? 0.7 : 0.18, 0.36)); break;
  }
}

let wakeLock = null, wantAwake = false;
async function keepAwake(on) {
  wantAwake = on;
  try {
    if (on) {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* not supported or denied: ignore */ }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && wantAwake) keepAwake(true); });

// Handler tables: click (data-a), change (data-c), input (data-i), submit (data-f).

document.addEventListener('click', e => {

document.addEventListener('change', e => {

document.addEventListener('input', e => {

document.addEventListener('submit', e => {

// ---------- router ----------
let leaveFns = [];

const navigate = p => { location.hash = '#' + p; };
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '').split('?')[0];

  return { name: seg[0] || 'home', p: seg.slice(1) };
}
const NAV_OF = { home: 'home', group: 'home', session: 'home', brief: 'home', trainee: 'home', exsum: 'home', manage: 'manage', exercise: 'manage', plan: 'home', template: 'manage', timer: 'timer', metronome: 'metro', settings: 'settings' };
function navHtml(active) {

  return `<div class="brand">${t('app.name')}</div>` + items.map(([id, href, ic, k]) => `<a href="#${href}" class="${id === active ? 'on' : ''}">${icon(ic)}<span>${t(k)}</span></a>`).join('');
}
function render() {

// ---------- sheets ----------
function openSheet(html) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  el.addEventListener('pointerdown', e => { if (e.target === el) closeSheet(); });
  document.body.appendChild(el);
  document.body.classList.add('noscroll');
  fitSheet();
  const f = el.querySelector('[autofocus]');
  if (f) setTimeout(() => f.focus(), 30);
}
// Keep the sheet inside the part of the screen not covered by the on-screen keyboard.
function fitSheet() {
  const o = $('.overlay'), v = window.visualViewport;
  if (!o || !v) return;
  o.style.top = v.offsetTop + 'px'; o.style.bottom = 'auto'; o.style.height = v.height + 'px';
}
document.addEventListener('focusin', e => {
  if (!e.target.closest('.sheet') || !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  setTimeout(() => { fitSheet(); e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 250);
});
if (window.visualViewport) { visualViewport.addEventListener('resize', fitSheet); visualViewport.addEventListener('scroll', fitSheet); }
function closeSheet() {
  const o = $('.overlay');
  if (o) o.remove();
  document.body.classList.remove('noscroll');
}
A.closeSheet = closeSheet;

function confirmBox(msg, okLabel, cb, danger = true) {

}
A.confirmOk = () => { const cb = ui.cb; closeSheet(); if (cb) cb(); };

function promptBox(title, label, value, cb) {

}

function toast(msg) {

function backupBanner() {

}

function blockHtml(c, cs, b, bi) {
  const d = dctx(cs, b), n = c.blocks.length, strength = b.type === 'strength';
  const head = `<div class="block-h"><div class="block-t"><span class="bn">${bi + 1}</span><strong>${t(strength ? 'block.strength' : 'block.interval')}</strong></div><div class="block-a">
    ${strength ? `<label class="rounds">${t('rounds')}<input type="number" inputmode="numeric" min="1" max="20" value="${b.rounds}" data-c="blockRounds" ${d}></label>` : ''}
    <button class="icon-btn sm" data-a="moveBlock" ${d} data-dir="-1" ${bi === 0 ? 'disabled' : ''} aria-label="${t('up')}">${icon('up')}</button>
    <button class="icon-btn sm" data-a="moveBlock" ${d} data-dir="1" ${bi === n - 1 ? 'disabled' : ''} aria-label="${t('down')}">${icon('down')}</button>
    <button class="icon-btn sm" data-a="delBlock" ${d} aria-label="${t('delete')}">${icon('trash')}</button></div></div>`;
  const items = b.items.map((it, ii) => itemLineHtml(cs, b, it, ii)).join('');
  const foot = `<button class="block-f" data-a="addItem" ${d}>${icon('plus')} ${t('item.add')}</button>`;
  const sum = strength ? '' : `<div class="iv-sum">${t('iv.sum', { w: b.work, r: b.rest, z: b.roundRest, n: b.rounds })}<button class="link-btn" data-a="editInterval" ${d}>${t('edit')}</button></div>`;
  return `<section class="block ${strength ? '' : 'iv'}">${head}<div class="block-b">${sum}${items || `<p class="muted">${t('block.empty')}</p>`}${foot}</div></section>`;
}

function itemControls(cs, b, it, ii) {
  const d = `${dctx(cs, b)} data-it="${it.id}"`;
  return `<div class="item-a"><button class="icon-btn sm" data-a="moveItem" ${d} data-dir="-1" ${ii === 0 ? 'disabled' : ''} aria-label="${t('up')}">${icon('up')}</button><button class="icon-btn sm" data-a="moveItem" ${d} data-dir="1" ${ii === b.items.length - 1 ? 'disabled' : ''} aria-label="${t('down')}">${icon('down')}</button><button class="icon-btn sm" data-a="delItem" ${d} aria-label="${t('delete')}">${icon('x')}</button></div>`;
}
const itemLineHtml = (cs, b, it, ii) => `<div class="iv-item"><span>${ii + 1}. ${esc(itemName(it))}${b.type === 'strength' && !it.exId ? `<span class="tag">${t('freetext')}</span>` : ''}</span>${itemControls(cs, b, it, ii)}</div>`;

const blockTitle = (b, bi) => `${bi + 1}. ${t(b.type === 'strength' ? 'block.strength' : 'block.interval')}`;
const blockNames = b => b.items.map(itemName).join(', ');

// Log tab: one block open at a time (accordion) so the page stays short.
function logHtml(s) {
  if (!s.blocks.length) return `<p class="muted">${t('block.empty')}</p>`;
  const open = (ui.openBlock || {})[s.id];
  const openId = s.blocks.some(b => b.id === open) ? open : open === '' ? '' : s.blocks[0].id;
  return `<div class="blocks">${s.blocks.map((b, bi) => {
    const on = b.id === openId, strength = b.type === 'strength';
    const head = `<button class="block-h acc" data-a="openBlock" data-s="${s.id}" data-b="${b.id}"><span class="acc-t"><span class="block-t"><span class="bn">${bi + 1}</span><strong>${t(strength ? 'block.strength' : 'block.interval')}</strong><span class="muted">${t('n.rounds', { n: b.rounds })}</span></span>${on ? '' : `<span class="muted acc-s">${esc(blockNames(b))}</span>`}</span>${strength ? `<span class="cnt bc">${blockDone(s, b)}</span>` : ''}${icon(on ? 'up' : 'down')}</button>`;
    let body = '';
    if (on) {
      if (strength) {
        const people = s.attendeeIds.map(getTrainee).filter(Boolean).sort(byName);
        const items = b.items.map(it => {
          const key = ek(it);
          const rows = people.map(tr => traineeRow(s, tr, key, b.rounds)).join('') || `<p class="muted">${t('session.noatt')}</p>`;
          const es = people.map(tr => getEntry(s.id, tr.id, key)).filter(Boolean);
          return `<div class="item"><div class="item-h"><div class="item-n">${esc(itemName(it))}${it.exId ? '' : `<span class="tag">${t('freetext')}</span>`}</div><span class="cnt">${es.filter(e => e.done).length}/${es.length}</span></div>${rows}</div>`;
        }).join('');
        body = `<div class="block-b">${items || `<p class="muted">${t('block.empty')}</p>`}</div>`;
      } else {
        body = `<a class="block-top" href="#/timer/s/${s.id}/${b.id}">${icon('timer')} ${t('timer.start')}</a><div class="block-b"><div class="iv-sum">${t('iv.sum', { w: b.work, r: b.rest, z: b.roundRest, n: b.rounds })}</div>${b.items.map((it, i) => `<div class="iv-item"><span>${i + 1}. ${esc(itemName(it))}</span></div>`).join('') || `<p class="muted">${t('block.empty')}</p>`}</div>`;
      }
    }
    return `<section class="block ${strength ? '' : 'iv'}">${head}${body}</section>`;
  }).join('')}</div>`;
}
function blockDone(s, b) {
  let total = 0, done = 0;
  for (const it of b.items) for (const tid of s.attendeeIds) { const e = getEntry(s.id, tid, ek(it)); if (e) { total++; if (e.done) done++; } }
  return total ? `${done}/${total}` : '';
}
A.openBlock = d => { (ui.openBlock = ui.openBlock || {})[d.s] = (ui.openBlock[d.s] === d.b || (!ui.openBlock[d.s] && getSession(d.s).blocks[0].id === d.b)) ? '' : d.b; render(); };

// Who does which progression for one exercise (used by the Program tab and the block briefing).
function itemGroupsHtml(s, it, people) {
  const key = ek(it);
  const list = people.map(tr => {
    const e = getEntry(s.id, tr.id, key), h = history(tr.id, key);
    return { t: tr, e, streak: e && isSet(e) ? streakAt(h, h.findIndex(x => x.e === e)) : null };
  });
  const { groups, none } = groupByStage(list, key);
  return groups.map(gr => `<div class="bgroup"><div class="bg-l">${esc(gr.label)} <span class="tag">${gr.items.length}</span></div><div class="bg-n">${gr.items.map(x => personHtml(x, true)).join('')}</div></div>`).join('') +
    (none.length ? `<div class="bgroup none"><div class="bg-l">${t('nodata')}</div><div class="bg-n">${none.map(x => `<span>${esc(x.t.name)}</span>`).join('')}</div></div>` : '');
}

// Program tab: the whole workout at a glance, for announcing it to the group.
function programHtml(s) {
  const people = s.attendeeIds.map(getTrainee).filter(Boolean);
  const blocks = s.blocks.map((b, bi) => {
    if (b.type === 'strength') {
      const items = b.items.map(it => `<details class="pgm-ex"><summary>${esc(itemName(it))}</summary>${itemGroupsHtml(s, it, people)}</details>`).join('');
      return `<section class="brief-item"><h2>${bi + 1}. ${t('block.strength')} <span class="tag">${t('n.rounds', { n: b.rounds })}</span></h2>${items || `<p class="muted">${t('block.empty')}</p>`}</section>`;
    }
    return `<section class="brief-item iv"><h2>${bi + 1}. ${t('block.interval')} <span class="tag">${t('n.rounds', { n: b.rounds })}</span></h2>
      <div class="iv-sum">${t('iv.sum', { w: b.work, r: b.rest, z: b.roundRest, n: b.rounds })}</div>
      <div class="chips">${b.items.map(it => `<span class="tag">${esc(itemName(it))}</span>`).join('')}</div>
      <div class="row"><a class="btn small primary" href="#/timer/s/${s.id}/${b.id}">${icon('timer')} ${t('timer.start')}</a></div></section>`;
  }).join('');
  return `${s.note ? `<p class="muted"><i>${esc(s.note)}</i></p>` : ''}${s.date > todayStr() ? `<p class="muted">${t('session.planned')}</p>` : ''}
    ${s.blocks.length ? `<div class="row"><button class="btn small" data-a="expandAll">${t('expand.all')}</button>${getGroup(s.groupId) && getGroup(s.groupId).solo ? '' : `<span class="muted">${t('n.attendees', { n: people.length })}</span>`}</div>` : ''}
    ${blocks || `<p class="muted">${t('block.empty')}</p>`}`;
}
A.expandAll = () => {
  const ds = [...document.querySelectorAll('.pgm-ex')], open = ds.some(d => !d.open);
  ds.forEach(d => { d.open = open; });
};

function traineeRow(s, tr, key, rounds) {
  const e = getEntry(s.id, tr.id, key);
  if (!e) return '';
  const prev = prevEntry(s, tr.id, key);
  const h = history(tr.id, key);
  const sk = streakAt(h, h.findIndex(x => x.e === e));
  const set = isSet(e);
  const changed = set && prev && !sameStage(e, prev);
  const lad = ladder(key);
  const idx = e.progId ? lad.findIndex(x => x.id === e.progId) : -1;
  const canUp = lad.length && !e.text && idx < lad.length - 1;
  const d = `data-s="${s.id}" data-t="${tr.id}" data-k="${esc(key)}"`;
  const wOn = !!e.weighted;
  return `<div class="trow ${e.note ? 'show-note' : ''} ${wOn ? 'show-w' : ''} ${e.done ? 'done' : ''}"><div class="tn"><span class="tn-l"><button class="donebtn ${e.done ? 'on' : ''}" data-a="togDone" ${d} title="${t('done.btn')}" aria-label="${t('done.btn')}">${icon('check')}</button><a href="#/trainee/${tr.id}">${esc(tr.name)}</a></span>${tr.note ? `<span class="prev warn-note">${esc(tr.note)}</span>` : ''}<span class="prev">${prev ? t('last') + ': ' + esc(entryLabel(prev)) + (extraText(prev) ? ' · ' + esc(extraText(prev)) : '') : t('first')}</span></div>
    <div class="tctl"><button class="stage ${set ? '' : 'unset'} ${changed ? 'changed' : ''}" data-a="stage" ${d}><span>${set ? esc(entryLabel(e)) : t('stage.unset')}</span><span class="badges">${set ? streakChips(sk) : ''}</span></button>${canUp ? `<button class="mini" data-a="nextStep" ${d} aria-label="${t('stage.next')}" title="${t('stage.next')}">${icon('up')}</button>` : ''}</div>
    <div class="tmeta"><span class="rr">${rounds}×</span><input type="number" inputmode="numeric" min="0" max="999" class="reps" value="${esc(e.reps || '')}" placeholder="${t('reps.ph')}" data-c="reps" ${d}>
      <button class="kgbtn ${wOn ? 'on' : ''}" data-a="togW" ${d} title="${t('weighted')}">+kg</button>
      <input type="text" inputmode="decimal" class="wt" value="${esc(e.weight || '')}" placeholder="kg" data-c="weight" ${d}><span class="spacer"></span>
      <button class="icon-btn sm notebtn ${e.note ? 'on' : ''}" data-a="togNote" title="${t('note.btn')}" aria-label="${t('note.btn')}">${icon('edit')}</button></div>
    <input type="text" class="note-in" value="${esc(e.note || '')}" placeholder="${t('note.ph')}" data-c="note" ${d}></div>`;
}

// ----- exercise picker (multi-select), shared by blocks, templates and the planner -----
// conf: { title, allowText, allowNew, names?: () => suggested free names (replaces the library list), have: () => Set of ids already present, add: (ids, texts) => void }
const existingKeys = c => new Set(c.blocks.filter(x => x.type === 'strength').flatMap(x => x.items.map(ek)));
function openPicker(conf) {
  ui.pick = { conf, sel: [], texts: [] };
  openSheet(`<h2>${esc(conf.title)}</h2><input type="text" id="pickQ" data-i="pickSearch" placeholder="${conf.allowText ? t('pick.ph') : t('pick.ph2')}" autocomplete="off">
    <div id="pickRes" class="pick-res">${pickResults('')}</div><div id="pickSel" class="pick-sel"></div>
    <div class="row end"><button class="btn" data-a="closeSheet">${t('cancel')}</button><button class="btn primary" id="pickAdd" data-a="pickAdd" disabled>${t('pick.add', { n: 0 })}</button></div>`);
}
A.addItem = d => {
  const b = findBlock(getCtx(d.ctx), d.b);
  openPicker({
    title: t('item.add'), allowText: true, allowNew: b.type === 'strength', names: b.type === 'interval' ? intervalNames : null,
    have: () => (b.type === 'strength' ? existingKeys(getCtx(d.ctx)) : new Set()),
    add: (ids, texts) => {
      const c = getCtx(d.ctx), blk = findBlock(c, d.b), have = existingKeys(c);
      let dup = 0;
      for (const it of [...ids.map(id => ({ exId: id, name: getExercise(id).name })), ...texts.map(name => ({ name }))]) {
        const k = ek(it);
        if (blk.type === 'strength') { if (have.has(k)) { dup++; continue; } have.add(k); }
        blk.items.push({ id: uid(), ...it });
      }
      c.after();
      if (dup) toast(t('pick.dup'));
    },
  });
};
// Names used in earlier interval blocks, most used first (interval exercises are not tracked, so they stay free text).
function intervalNames() {
  const cnt = new Map();
  for (const s of db.sessions) for (const b of s.blocks) if (b.type === 'interval') for (const it of b.items) { const n = itemName(it); cnt.set(n, (cnt.get(n) || 0) + 1); }
  return [...cnt.entries()].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0], locale())).map(x => x[0]);
}
function pickResults(q) {
  const conf = ui.pick.conf, nq = norm(q), have = conf.have();
  let out, known;
  if (conf.names) {
    const all = conf.names();
    known = all.some(n => norm(n) === nq);
    out = all.filter(n => !nq || norm(n).includes(nq)).map(n => `<label class="check"><input type="checkbox" data-c="pickToggleName" data-name="${esc(n)}" ${ui.pick.texts.some(y => norm(y) === norm(n)) ? 'checked' : ''}> ${esc(n)}</label>`).join('');
  } else {
    const list = db.exercises.filter(x => !nq || norm(x.name).includes(nq)).sort(byName);
    known = db.exercises.some(x => norm(x.name) === nq);
    out = list.map(x => {
      const off = have.has(x.id);
      return `<label class="check ${off ? 'off' : ''}"><input type="checkbox" data-c="pickToggle" data-id="${x.id}" ${off ? 'disabled' : ''} ${ui.pick.sel.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}${off ? `<span class="tag">${t('pick.exists')}</span>` : ''}</label>`;
    }).join('');
  }
  if (nq && !known) {
    if (conf.allowText) out += `<button class="pick-add" data-a="pickText">${icon('plus')} ${t('pick.text', { q: esc(q.trim()) })}</button>`;
    if (conf.allowNew) out += `<button class="pick-add" data-a="pickNew">${icon('plus')} ${t('pick.new', { q: esc(q.trim()) })}</button>`;
  }
  return out || `<p class="muted" style="padding:8px 10px;margin:0">${t('pick.none')}</p>`;
}
function pickRefresh() {
  const p = ui.pick, n = p.sel.length + p.texts.length;
  const btn = $('#pickAdd');
  btn.disabled = !n; btn.textContent = t('pick.add', { n });
  $('#pickSel').innerHTML = p.texts.map((x, i) => `<button class="chip on" data-a="pickUntext" data-n="${i}">${esc(x)} ${icon('x')}</button>`).join('');
}
I.pickSearch = v => { $('#pickRes').innerHTML = pickResults(v); };
C.pickToggle = (on, d) => {
  const s = ui.pick.sel, i = s.indexOf(d.id);
  if (on && i < 0) s.push(d.id); else if (!on && i >= 0) s.splice(i, 1);
  pickRefresh();
};
C.pickToggleName = (on, d) => {
  const tx = ui.pick.texts, i = tx.findIndex(y => norm(y) === norm(d.name));
  if (on && i < 0) tx.push(d.name); else if (!on && i >= 0) tx.splice(i, 1);
  pickRefresh();
};
// Free text: several names can be typed at once, separated by commas or new lines.
A.pickText = () => {
  const q = $('#pickQ');
  q.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean).forEach(x => { if (!ui.pick.texts.some(y => norm(y) === norm(x))) ui.pick.texts.push(x); });
  q.value = ''; $('#pickRes').innerHTML = pickResults(''); pickRefresh(); q.focus();
};
A.pickUntext = d => { ui.pick.texts.splice(+d.n, 1); pickRefresh(); $('#pickRes').innerHTML = pickResults($('#pickQ').value); };
A.pickNew = () => {

};
A.pickAdd = () => { const { conf, sel, texts } = ui.pick; closeSheet(); conf.add(sel, texts); };

        ${g && g.solo ? '' : `<div class="muted" style="margin-bottom:6px">${t('attendees')} (${s.attendeeIds.length})</div>
        <div class="chips">${members.map(chip).join('')}${guests.map(chip).join('')}<button class="chip" data-a="addGuest" data-s="${s.id}">${icon('plus')} ${t('guest')}</button></div>`}</div>
      ${blocksHtml('s:' + s.id)}
      <div class="row end"><button class="btn ghost-danger" data-a="delSession" data-s="${s.id}">${icon('trash')} ${t('session.delete')}</button></div>`;

// ----- setting a trainee's stage -----
A.stage = d => {
  const s = getSession(d.s), tr = getTrainee(d.t), e = getEntry(s.id, d.t, d.k), lad = ladder(d.k), prev = prevEntry(s, d.t, d.k);
  const steps = lad.map((st, i) => `<button class="step ${e.progId === st.id ? 'on' : ''} ${prev && prev.progId === st.id ? 'was' : ''}" data-a="stageSet" data-s="${s.id}" data-t="${tr.id}" data-k="${esc(d.k)}" data-id="${st.id}"><span class="si">${i + 1}</span>${esc(st.label)}${prev && prev.progId === st.id ? `<em>${t('last')}</em>` : ''}</button>`).join('');
  openSheet(`<h2>${esc(tr.name)} · ${esc(exName(d.k))}</h2>${prev ? `<p class="muted">${t('last')}: ${esc(entryLabel(prev))}</p>` : ''}
    ${lad.length ? `<div class="ladder">${steps}</div>` : `<p class="muted">${t('stage.noladder')}</p>`}
    <form data-f="stageText" data-s="${s.id}" data-t="${tr.id}" data-k="${esc(d.k)}"><label class="f">${t('stage.free')}<input type="text" name="text" value="${esc(e.text || '')}" placeholder="${t('stage.free.ph')}" ${lad.length ? '' : 'autofocus'} autocomplete="off"></label>
    <div class="row between"><button type="button" class="btn ghost-danger" data-a="stageClear" data-s="${s.id}" data-t="${tr.id}" data-k="${esc(d.k)}">${t('stage.clear')}</button><span class="row"><button type="button" class="btn" data-a="closeSheet">${t('cancel')}</button><button class="btn primary">${t('save')}</button></span></div></form>`);
};
const applyStep = (e, st) => { delete e.text; e.progId = st.id; e.label = st.label; };
A.stageSet = d => {
  const e = getEntry(d.s, d.t, d.k), st = ladder(d.k).find(x => x.id === d.id);
  applyStep(e, st); e.done = true; save(); closeSheet(); render();
};
F.stageText = (fd, d) => {
  const e = getEntry(d.s, d.t, d.k), text = String(fd.get('text') || '').trim();
  if (!text) { closeSheet(); return; }
  delete e.progId; delete e.label; e.text = text; e.done = true; save(); closeSheet(); render();
};
A.stageClear = d => {
  const e = getEntry(d.s, d.t, d.k);
  delete e.progId; delete e.label; delete e.text; e.done = false; save(); closeSheet(); render();
};
A.nextStep = d => {
  const e = getEntry(d.s, d.t, d.k), lad = ladder(d.k);
  const i = e.progId ? lad.findIndex(x => x.id === e.progId) : -1;
  if (i + 1 >= lad.length) return;
  applyStep(e, lad[i + 1]); e.done = true; save(); render();
};
// A row counts as done once its reps/weight/stage were set by hand (or ticked), not just prefilled from last time.
function setRowDone(row, e, on) {
  e.done = on;
  row.classList.toggle('done', on);
  row.querySelector('.donebtn').classList.toggle('on', on);
  refreshDone();
}
function refreshDone() {
  document.querySelectorAll('.block').forEach(blk => {
    const rows = blk.querySelectorAll('.trow');
    if (!rows.length) return;
    blk.querySelectorAll('.item').forEach(it => {
      const c = it.querySelector('.cnt'), r = it.querySelectorAll('.trow');
      if (c) c.textContent = `${it.querySelectorAll('.trow.done').length}/${r.length}`;
    });
    const bc = blk.querySelector('.block-h.acc .bc');
    if (bc) bc.textContent = `${blk.querySelectorAll('.trow.done').length}/${rows.length}`;
  });
}
C.reps = (v, d, el) => {
  const e = getEntry(d.s, d.t, d.k), n = parseInt(v, 10);
  e.reps = Number.isFinite(n) && n > 0 ? String(n) : '';
  if (e.reps) setRowDone(el.closest('.trow'), e, true);
  save();
};
C.weight = (v, d, el) => {
  const e = getEntry(d.s, d.t, d.k);
  e.weight = v.trim();
  if (e.weight) setRowDone(el.closest('.trow'), e, true);

};
A.togDone = (d, el) => { const e = getEntry(d.s, d.t, d.k); setRowDone(el.closest('.trow'), e, !e.done); save(); };
C.note = (v, d) => { getEntry(d.s, d.t, d.k).note = v.trim(); save(); };
A.togW = (d, el) => {

/* 07b-view-plan.js */
// Workout planner: pick today's exercises from the group's template and split them into blocks with one tap each.
const lastDoneSession = gid => {
  const ss = db.sessions.filter(s => s.groupId === gid).sort(sessionCmp);
  return [...ss].reverse().find(s => s.date <= todayStr()) || ss[ss.length - 1];
};
const lastIntervalBlock = gid => {
  for (const s of db.sessions.filter(x => x.groupId === gid).sort(sessionCmp).reverse()) {
    const b = s.blocks.find(x => x.type === 'interval');
    if (b) return b;
  }
  return null;
};
const planPool = () => {
  const tp = getTemplate(ui.plan.tplId);
  const base = tp ? tp.exIds : [];
  return [...base, ...ui.plan.extra.filter(x => !base.includes(x))].filter(getExercise);
};
// First block (1, 2, 3, ...) that still has room for another exercise (3 per block).
function planAutoGroup() {
  const cnt = {};
  for (const v of Object.values(ui.plan.assign)) if (v) cnt[v] = (cnt[v] || 0) + 1;
  let n = 1;
  while ((cnt[n] || 0) >= 3) n++;
  return n;
}
function planPut(id, n) {
  const P = ui.plan;
  P.assign[id] = n;
  if (!n) P.order = P.order.filter(x => x !== id);
  else if (!P.order.includes(id)) P.order.push(id);
}

V.plan = ([gid]) => {
  const g = getGroup(gid);
  if (!g) return notFound();
  if (!ui.plan || ui.plan.gid !== gid) {
    ui.plan = { gid, tplId: g.templateId || '', date: todayStr(), assign: {}, order: [], extra: [], rounds: {}, interval: !!lastIntervalBlock(gid) };
    onLeave(() => { ui.plan = null; });
  }
  const P = ui.plan, tp = getTemplate(P.tplId), pool = planPool();
  const used = Object.values(P.assign).filter(Boolean);
  const maxG = Math.min(6, Math.max(3, (used.length ? Math.max(...used) : 0) + 1));
  const rows = pool.map(id => {
    const n = P.assign[id] || 0;
    const extra = !(tp && tp.exIds.includes(id));
    return `<div class="plan-row ${n ? 'on' : ''}"><button class="plan-name" data-a="planTap" data-id="${id}"><span class="pn-n">${n || ''}</span><span>${esc(exName(id))}${extra ? `<span class="tag">${t('plan.extra')}</span>` : ''}</span></button>
      <div class="seg">${Array.from({ length: maxG + 1 }, (_, k) => `<button class="${n === k ? 'on' : ''}" data-a="planSet" data-id="${id}" data-n="${k}">${k || '–'}</button>`).join('')}</div></div>`;
  }).join('');
  const nums = [...new Set(used)].sort((a, b) => a - b);
  const summary = nums.map((n, i) => `<div><b>${t('plan.block', { n: i + 1 })}</b> ${P.order.filter(x => P.assign[x] === n).map(x => esc(exName(x))).join(', ')}</div>`).join('');
  const opts = [...db.templates].sort(byName).map(x => `<option value="${x.id}" ${x.id === P.tplId ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const body = `<div class="card"><div class="fields"><label class="f">${t('date')}<input type="date" value="${P.date}" data-c="planDate"></label>
      <label class="f">${t('plan.tpl')}<select data-c="planTpl"><option value="">${t('tpl.none')}</option>${opts}</select></label></div>
      ${(P.tplId || '') !== (g.templateId || '') && P.tplId ? `<button class="link-btn" data-a="planTplSave">${t('plan.tpl.save')}</button>` : ''}
      <div class="join"><button class="btn" data-a="planLast">${t('plan.last')}</button><button class="btn" data-a="planSplit">${t('plan.split')}</button><button class="btn" data-a="planClear">${t('plan.clear')}</button></div>
      <p class="muted" style="margin:0">${t('plan.help')}</p></div>
    ${pool.length ? `<div class="plan-list">${rows}</div>` : `<p class="muted">${tp ? t('plan.emptypool') : t('plan.notpl')}</p>`}
    <button class="btn full" data-a="planAdd">${icon('plus')} ${t('plan.add')}</button>
    ${summary ? `<div class="card plan-sum">${summary}</div>` : ''}
    <div class="plan-bar"><span class="muted">${t('plan.sum', { b: nums.length, n: used.length })}</span>
      <label class="check"><input type="checkbox" data-c="planInterval" ${P.interval ? 'checked' : ''}> ${t('plan.interval')}</label>
      <button class="btn primary" data-a="planCreate">${t('plan.create')}</button></div>`;
  return { html: header(t('plan.title'), { back: `/group/${gid}/sessions`, sub: g.name }) + `<div class="page">${body}</div>` };
};

A.planTap = ({ id }) => { planPut(id, ui.plan.assign[id] ? 0 : planAutoGroup()); render(); };
A.planSet = ({ id, n }) => { planPut(id, +n); render(); };
A.planClear = () => { ui.plan.assign = {}; ui.plan.order = []; render(); };
// Spread the chosen exercises evenly over blocks of about 3 (8 -> 3+3+2, 9 -> 3+3+3).
A.planSplit = () => {
  const P = ui.plan, list = P.order.filter(x => P.assign[x]), n = list.length;
  if (!n) { toast(t('plan.none')); return; }
  const gn = Math.ceil(n / 3), base = Math.floor(n / gn), rem = n % gn;
  let i = 0;
  for (let gi = 0; gi < gn; gi++) for (let k = 0; k < base + (gi < rem ? 1 : 0); k++) P.assign[list[i++]] = gi + 1;
  render();
};
A.planLast = () => {
  const P = ui.plan, s = lastDoneSession(P.gid);
  if (!s) { toast(t('plan.nolast')); return; }
  P.assign = {}; P.order = []; P.rounds = {};
  let bi = 0;
  for (const b of s.blocks.filter(x => x.type === 'strength')) {
    bi++;
    for (const it of b.items) {
      if (!it.exId || !getExercise(it.exId)) continue;
      if (!planPool().includes(it.exId)) P.extra.push(it.exId);
      planPut(it.exId, bi);
    }
    P.rounds[bi] = b.rounds;
  }
  P.interval = s.blocks.some(x => x.type === 'interval') || !!lastIntervalBlock(P.gid);
  render();
};
A.planAdd = () => openPicker({
  title: t('plan.add'), allowText: false, allowNew: true,
  have: () => new Set(planPool()),
  add: ids => {
    for (const id of ids) {
      if (!planPool().includes(id)) ui.plan.extra.push(id);
      if (!ui.plan.assign[id]) planPut(id, planAutoGroup());
    }
    render();
  },
});
C.planTpl = v => {
  const P = ui.plan;
  P.tplId = v;
  // exercises already chosen but not in the new template stay available as extras
  for (const id of Object.keys(P.assign)) if (P.assign[id] && !planPool().includes(id) && !P.extra.includes(id)) P.extra.push(id);
  render();
};
A.planTplSave = () => { getGroup(ui.plan.gid).templateId = ui.plan.tplId; save(); toast(t('plan.tpl.saved')); render(); };
C.planDate = v => { ui.plan.date = v || todayStr(); };
C.planInterval = v => { ui.plan.interval = v; };
A.planCreate = () => {
  const P = ui.plan, nums = [...new Set(Object.values(P.assign).filter(Boolean))].sort((a, b) => a - b);
  if (!nums.length) { toast(t('plan.none')); return; }
  const blocks = nums.map(n => ({
    id: uid(), type: 'strength', rounds: P.rounds[n] || 3,
    items: P.order.filter(x => P.assign[x] === n).map(x => ({ id: uid(), exId: x, name: exName(x) })),
  }));
  if (P.interval) {
    const ib = lastIntervalBlock(P.gid);
    blocks.push(ib ? { ...ib, id: uid(), items: ib.items.map(i => ({ ...i, id: uid() })) } : { id: uid(), type: 'interval', rounds: 3, work: 40, rest: 20, roundRest: 60, items: [] });
  }
  const grp = getGroup(P.gid);
  const s = { id: uid(), groupId: grp.id, date: P.date, created: Date.now(), attendeeIds: activeMembers(grp).map(x => x.id), blocks, note: '' };
  db.sessions.push(s);
  syncEntries(s); save();
  navigate('/session/' + s.id);
};

/* 08-view-people.js */
// Trainee profile, manage (trainees / groups / exercises), exercise editor.
V.trainee = ([id]) => {
  const tr = getTrainee(id);
  if (!tr) return notFound();
  const today = todayStr();
  const groups = db.groups.filter(g => g.traineeIds.includes(id));
  const mine = db.entries.filter(e => e.traineeId === id && isSet(e) && getSession(e.sessionId));
  const attended = db.sessions.filter(s => s.attendeeIds.includes(id) && s.date <= today).sort(sessionCmp).reverse();
  const keys = [...new Set(mine.map(e => e.ek))].sort((a, b) => exName(a).localeCompare(exName(b), locale()));
  const rows = keys.map(k => {
    const L = latest(id, k), path = stagePath(id, k);
    return `<div class="card"><div class="row between" style="margin:0"><div class="card-t">${esc(exName(k))}</div>${L ? `<div>${esc(entryLabel(L.e))} ${streakChips(L.streak)}</div>` : ''}</div>
      <div class="path">${path.map((p, i) => `${i ? `<span class="a">→</span>` : ''}<span class="p">${esc(entryLabel(p.e))} (${p.n})</span>`).join('')}</div></div>`;
  }).join('');
  const days = attended.map(s => {
    const es = db.entries.filter(e => e.sessionId === s.id && e.traineeId === id && isSet(e));
    return `<div class="tl-day"><div class="d"><a href="#/session/${s.id}">${fmtLong(s.date)}</a></div>${es.map(e => `<div class="tl-ent"><span>${esc(exName(e.ek))}</span><span>${esc(entryLabel(e))}${extraText(e) ? ' · ' + esc(extraText(e)) : ''}</span></div>${e.note ? `<div class="tl-note">“${esc(e.note)}”</div>` : ''}`).join('') || `<div class="muted">${t('attended')}</div>`}</div>`;
  }).join('');
  const info = `<div class="card"><div class="muted">${groups.map(g => esc(g.name)).join(', ') || t('nogroup')} · ${t('n.sessions', { n: attended.length })}</div>${tr.note ? `<div class="warn-note" style="margin-top:6px">${esc(tr.note)}</div>` : ''}</div>`;
  return { html: header(tr.name, { back: groups[0] ? `/group/${groups[0].id}/matrix` : '/', actions: `<button class="icon-btn" data-a="editTrainee" data-id="${id}" aria-label="${t('edit')}">${icon('edit')}</button>` }) +
    `<div class="page">${info}<h2>${t('trainee.progress')}</h2>${rows || `<p class="muted">${t('nodata')}</p>`}<h2 style="margin-top:10px">${t('trainee.history')}</h2><div class="card">${days || `<p class="muted">${t('nodata')}</p>`}</div></div>` };
};

/* 10-view-tools.js */
// Interval timer and metronome. Both run on the Web Audio clock so sounds stay exact and pausing is trivial.
let T = null; // interval timer state

function initTimer(p) {
  let cfg = { ...db.settings.timer }, back = null;
  if (p.length === 3) {
    const c = getCtx(p[0] + ':' + p[1]);
    const b = c && findBlock(c, p[2]);
    if (b && b.type === 'interval') {
      cfg = { rounds: b.rounds, n: Math.max(1, b.items.length), work: b.work, rest: b.rest, roundRest: b.roundRest, prep: db.settings.timer.prep, names: b.items.map(itemName).join('\n') };
      back = '/session/' + p[1];
    }
  }
  return { mode: 'setup', cfg, back, phases: [], total: 0, pi: -1 };
}

function tmPhases(c) {
  const ph = []; let s = 0;
  const add = (type, d, r, i) => { if (d > 0) { ph.push({ type, d, s, r, i }); s += d; } };
  add('prep', c.prep, -1, -1);
  for (let r = 0; r < c.rounds; r++) {
    for (let i = 0; i < c.n; i++) {
      add('work', c.work, r, i);
      const last = r === c.rounds - 1 && i === c.n - 1;
      if (!last) add(i === c.n - 1 ? 'roundrest' : 'rest', i === c.n - 1 ? c.roundRest : c.rest, r, i);
    }
  }
  return { ph, total: s };
}
function tmEvents(ph, total) {
  const ev = [];
  const kinds = { work: 'go', rest: 'rest', roundrest: 'rr' };
  for (const p of ph) {
    if (kinds[p.type]) ev.push({ t: p.s, k: kinds[p.type] });
    for (let j = 3; j >= 1; j--) if (p.d > j) ev.push({ t: p.s + p.d - j, k: 'tick' });
  }
  ev.push({ t: total, k: 'end' });
  return ev.sort((a, b) => a.t - b.t);
}
const tmNames = c => c.names.split('\n').map(x => x.trim()).filter(Boolean);
const tmLabel = (c, i) => tmNames(c)[i] || `${t('exercise')} ${i + 1}`;
const tmTotal = c => tmPhases(c).total;

V.timer = p => {
  if (!T) { T = initTimer(p); onLeave(tmStop); }
  return { html: timerHtml(), mount: tmMount };
};
const renderTimer = () => { $('#view').innerHTML = timerHtml(); tmMount(); };
const tmMount = () => { if (T && T.mode === 'run') tmFrame(true); };

function timerHtml() {
  const hd = header(t('nav.timer'), { back: T.back || undefined });
  if (T.mode === 'setup') {
    const c = T.cfg;
    const num = (k, label, step = 1) => `<label class="f">${label}<div class="stepper"><button data-a="tmStep" data-k="${k}" data-d="-${step}" aria-label="-">−</button><input type="number" inputmode="numeric" value="${c[k]}" data-c="tmSet" data-k="${k}"><button data-a="tmStep" data-k="${k}" data-d="${step}" aria-label="+">+</button></div></label>`;
    return hd + `<div class="page"><div class="card"><div class="fields">${num('work', t('tm.work'), 5)}${num('rest', t('tm.rest'), 5)}${num('roundRest', t('tm.roundRest'), 5)}${num('prep', t('tm.prep'), 5)}${num('rounds', t('rounds'))}${num('n', t('tm.perRound'))}
      <label class="f full">${t('tm.names')}<textarea data-c="tmNames" placeholder="${t('tm.names.ph')}">${esc(c.names)}</textarea></label></div>
      <div class="total" id="tmTotal">${t('tm.total', { d: fmtDur(tmTotal(c)) })}</div>
      <label class="f">${t('volume')}<input type="range" min="0" max="100" value="${Math.round(db.settings.vol * 100)}" data-i="vol"></label>
      <div class="row" style="justify-content:center"><button class="btn primary big-play" data-a="tmStart">${icon('play')} ${t('tm.start')}</button></div>
      <p class="muted" style="text-align:center">${t('tm.help')}</p></div></div>`;
  }
  const c = T.cfg;
  if (T.mode === 'done') {
    return hd + `<div class="page"><div class="tm tm-done"><div class="tm-phase">${t('tm.done')}</div><div class="tm-ex">${t('tm.total', { d: fmtDur(T.total) })}</div>
      <div class="tm-ctl"><button class="btn primary" data-a="tmStart">${icon('play')} ${t('tm.again')}</button><button class="btn" data-a="tmSetup">${t('tm.setup')}</button></div></div></div>`;
  }
  const p = T.phases[Math.max(0, T.pi)] || T.phases[0];
  const nx = T.phases[T.pi + 1];
  const nextTxt = nx ? t('tm.next') + ': ' + (nx.type === 'work' ? tmLabel(c, nx.i) : t('ph.' + nx.type)) : t('tm.last');
  const top = p.type === 'prep' ? t('tm.getready') : t('tm.pos', { r: p.r + 1, rs: c.rounds, i: p.i + 1, n: c.n });
  const exTxt = p.type === 'work' ? tmLabel(c, p.i) : p.type === 'prep' ? tmLabel(c, 0) : (p.i + 1 < c.n && p.type === 'rest' ? tmLabel(c, p.i + 1) : '');
  return hd + `<div class="page"><div class="tm tm-${p.type}"><div class="tm-top">${top}</div><div class="tm-phase">${t('ph.' + p.type)}</div>
    <div class="tm-count" id="tmCount">0</div><div class="tm-ex">${esc(exTxt)}</div><div class="tm-next">${esc(nextTxt)}</div>
    <div class="tm-bar"><i id="tmBar"></i></div>
    <div class="tm-ctl"><button class="btn" data-a="tmPrev" aria-label="${t('prev')}">${icon('prev')}</button>
      <button class="btn primary" data-a="tmPause" aria-label="${t('tm.pause')}">${icon(T.paused ? 'play' : 'pause')}</button>
      <button class="btn" data-a="tmNext" aria-label="${t('next')}">${icon('next')}</button>
      <button class="btn" data-a="tmSetup" aria-label="${t('stop')}">${icon('stop')}</button></div></div></div>`;
}

A.tmStep = d => {
  const k = d.k, lim = { work: [1, 3600], rest: [0, 3600], roundRest: [0, 3600], prep: [0, 60], rounds: [1, 20], n: [1, 12] }[k];
